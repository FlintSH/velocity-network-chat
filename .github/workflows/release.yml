name: Test and release
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: networkchat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    name: Build both JARs and verify Paper bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set unique commit version
        run: mvn -B -ntp -Ppaper org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="1.1.${GITHUB_RUN_NUMBER}" -DgenerateBackupPoms=false
      - name: Verify baseline proxy, protocol and Paper modules
        run: mvn -B -ntp -Ppaper clean verify dependency:build-classpath -Dmdep.outputFile=target/test-classpath.txt
      - name: Exercise authenticated bridge in real Paper 26.1.2
        run: python3 scripts/bridge-smoke.py "paper-bridge/target/networkchat-paper-bridge-1.1.${GITHUB_RUN_NUMBER}.jar"
      - name: Collect exact tested artifacts
        run: |
          mkdir release-artifacts
          cp plugin/target/velocity-network-chat-*.jar paper-bridge/target/networkchat-paper-bridge-*.jar release-artifacts/
          cd release-artifacts
          sha256sum *.jar > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: networkchat-${{ github.run_number }}
          path: release-artifacts/
  test:
    name: API ${{ matrix.api }} / Java ${{ matrix.java }}
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '3.1.1'
            java: '17'
          - api: '3.4.0'
            java: '21'
          - api: '4.2.0'
            java: '25'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Compile and test against this Velocity API
        run: mvn -B -ntp -Dvelocity.api.version=${{ matrix.api }} clean verify
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: networkchat-${{ github.run_number }}
          path: release-artifacts
      - name: Verify baseline artifact checksums
        working-directory: release-artifacts
        run: sha256sum -c SHA256SUMS
      - name: Exercise the release JAR in a real proxy
        run: python3 scripts/smoke.py "$JAVA_HOME/bin/java" "release-artifacts/velocity-network-chat-1.1.${GITHUB_RUN_NUMBER}.jar" '${{ matrix.api }}'
      - name: Verify optional PAPIProxyBridge API
        if: matrix.api == '3.4.0'
        run: python3 scripts/smoke.py "$JAVA_HOME/bin/java" "release-artifacts/velocity-network-chat-1.1.${GITHUB_RUN_NUMBER}.jar" '${{ matrix.api }}' --bridge
  release:
    name: Publish tested commit release
    needs: [package, test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: networkchat-${{ github.run_number }}
          path: release-artifacts
      - name: Verify tested artifact checksums
        working-directory: release-artifacts
        run: sha256sum -c SHA256SUMS
      - name: Publish release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Velocity Network Chat 1.1.${GITHUB_RUN_NUMBER}" --prerelease --generate-notes
          fi
          gh release upload "$tag" release-artifacts/*.jar release-artifacts/SHA256SUMS --clobber
