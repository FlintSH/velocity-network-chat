name: Test and release
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: networkchat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: API ${{ matrix.api }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '3.1.1'
            java: '17'
          - api: '3.4.0'
            java: '21'
          - api: '4.2.0'
            java: '25'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -ntp -Dvelocity.api.version=${{ matrix.api }} clean verify
      - name: Build baseline JAR for runtime compatibility check
        run: mvn -B -ntp -DskipTests clean package
      - name: Start a real proxy and exercise plugin commands
        run: python3 scripts/smoke.py "$JAVA_HOME/bin/java" plugin/target/velocity-network-chat-1.0.0.jar '${{ matrix.api }}'
      - name: Verify optional PAPIProxyBridge API with a real proxy
        if: matrix.api == '3.4.0'
        run: python3 scripts/smoke.py "$JAVA_HOME/bin/java" plugin/target/velocity-network-chat-1.0.0.jar '${{ matrix.api }}' --bridge
  release:
    name: Publish commit release
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set unique commit version
        run: mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="1.0.${GITHUB_RUN_NUMBER}" -DgenerateBackupPoms=false
      - run: mvn -B -ntp clean verify
      - name: Generate checksum
        working-directory: plugin/target
        run: sha256sum velocity-network-chat-*.jar > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: velocity-network-chat-${{ github.run_number }}
          path: |
            plugin/target/velocity-network-chat-*.jar
            plugin/target/SHA256SUMS
      - name: Publish release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Velocity Network Chat 1.0.${GITHUB_RUN_NUMBER}" --prerelease --generate-notes
          fi
          gh release upload "$tag" plugin/target/velocity-network-chat-*.jar plugin/target/SHA256SUMS --clobber
