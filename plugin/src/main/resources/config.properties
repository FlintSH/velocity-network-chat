# Velocity Network Chat — UTF-8. Reload with /networkchat reload.
# Empty permission means everyone. Staff/admin permissions should never be empty.
config-version=1
chat.capture=true
chat.default-channel=global
# Required for normal signed chat: SignedVelocity on proxy AND these backends.
# Explicitly list verified server names; '*' acknowledges installation on ALL backends.
chat.signed-backends=
chat.excluded-servers=
# A server's group confines GLOBAL chat to that group. Unlisted servers use default.
routing.default-group=network
# routing.group.lobby=hub
# routing.group.survival=survival
# display.server.lobby=Lobby
chat.max-length=256
chat.cooldown-ms=750
staff.cooldown-ms=250
private.cooldown-ms=500
private.enabled=true
private.allow-self=false
private.respect-groups=false
suggestions.limit=50
suggestions.chat=true
suggestions.chat-limit=10000
# 1.13–1.19 clients complete names from TAB. Remote entries appear in their TAB list.
suggestions.legacy-tab-list=true
suggestions.legacy-tab-limit=500
suggestions.refresh-ms=2000
# Retain legacy defaults for existing configurations. Choose minimessage for <tags>.
format.mode=legacy
message.mode=legacy
# PAPIProxyBridge on proxy + backend, PlaceholderAPI and expansions on backend.
placeholders.enabled=true
placeholders.prefix=%luckperms_prefix%
placeholders.format=legacy
# Colour {player}/<player> using the last coloured rank word, ignoring brackets/spaces.
# Set false to honour the username colour explicitly configured in your template.
placeholders.inherit-name-color=true
placeholders.fallback=
placeholders.timeout-ms=1000
placeholders.cache-ms=30000
staff.toggle=true
format.global=&8[&b{server}&8] {prefix}&f{player}&8: &7{message}
format.local=&8[Local] {prefix}&f{player}&8: &7{message}
format.staff=&8[&cStaff&8] [&7{server}&8] {prefix}&f{player}&8: &e{message}
format.private-sent=&8[&7You → {target}&8] &f{message}
format.private-received=&8[&7{player} → You&8] &f{message}
permission.global-send=
permission.global-receive=
permission.local-send=
permission.staff-send=networkchat.staff.send
permission.staff-receive=networkchat.staff.receive
permission.private=networkchat.msg
permission.admin=networkchat.admin
permission.bypass-cooldown=networkchat.bypass.cooldown
permission.hidden=networkchat.hidden
permission.see-hidden=networkchat.see.hidden
# Alias changes require proxy restart. Collision with another proxy command fails startup.
command.global=g,global
command.staff=staffchat,sc
command.message=msg,tell,whisper,w
command.reply=reply,r
command.ignore=ignore
command.toggle=msgtoggle
command.channel=chat
command.admin=networkchat,nchat
message.no-permission=&cYou do not have permission.
message.players-only=&cOnly players can use this command.
message.invalid-message=&cMessage must be 1–{limit} characters without control characters.
message.cooldown=&cPlease wait before sending another message.
message.unavailable=&cThat player is unavailable.
message.self=&cYou cannot message yourself.
message.private-disabled=&cPrivate messages are disabled.
message.no-reply=&cNobody has messaged you in this session.
message.ignored=&e{target}: ignore {state}.
message.toggle=&ePrivate message receiving: {state}.
message.channel=&eChat channel: {channel}.
message.invalid-channel=&cUse /chat global|local.
message.unsafe-channel=&cNormal chat cannot be captured safely here. Use /g or /sc instead.
message.excluded=&cNetwork chat is disabled on this server.
message.reload=&aConfiguration reloaded. Alias changes require a restart.
message.reload-failed=&cConfiguration invalid; previous configuration remains active. See proxy log.
message.usage-global=&e/g <message>
message.usage-staff=&e/sc [on|off|message]
message.usage-message=&e/msg <player> <message>
message.usage-reply=&e/reply <message>
message.usage-ignore=&e/ignore <player>
message.usage-admin=&e/networkchat reload|status

message.toggle-usage=&e/msgtoggle
message.ignore-limit=&cYou have reached the session ignore limit (1000).
message.reload-busy=&eA configuration reload is already running.
message.status=&ePlayers: {players}, sessions: {sessions}, capture: {capture}, SignedVelocity: {signed}.

message.staff-toggle=&eStaff chat: {state}.
message.staff-toggle-disabled=&cStaff chat toggling is disabled. Use /sc <message>.
message.staff-unsafe=&cStaff mode needs safe chat capture here. Use /sc <message>.
message.staff-switch-blocked=&cTurn staff mode off with /sc off before joining this server; safe chat capture is unavailable there.
message.staff-disconnected=&cStaff chat capture became unavailable. Your message was blocked to protect staff privacy. Reconnect and use /sc <message>.
message.queue-full=&cToo many messages are waiting for placeholders. Please try again shortly.
message.delivery-cancelled=&cMessage cancelled because your server or permissions changed before delivery.

# Proxy sessions only: one join after first backend connect, one leave after disconnect.
announcements.join=true
announcements.leave=true
announcements.scope=network
permission.announcements=
format.join=&8[&a+&8] &f{player} &7joined the network.
format.leave=&8[&c-&8] &f{player} &7left the network.
