# Network Chat teleports. All settings in this file require a proxy restart.
# Install networkchat-paper-bridge on every participating Paper/Purpur 26.1.2 server.
# Use the SAME randomly generated secret (at least 32 characters) in the bridge config.
# Empty secret keeps commands available but refuses teleports until setup is complete.
enabled=true
shared-secret=
# Velocity server names. '*' allows any server with a correctly configured bridge.
servers=*
respect-chat-groups=false
request-seconds=60
cooldown-seconds=10
transfer-seconds=15
max-incoming=10
max-transfers=1000
# Empty request permission allows everyone. Staff and bypass nodes cannot be empty.
permission.request=
permission.staff=networkchat.teleport.staff
permission.bypass-cooldown=networkchat.teleport.bypass-cooldown
command.request=tpa,tpask
command.accept=tpaccept,tpyes
command.deny=tpdeny,tpno
command.cancel=tpcancel
command.staff=tp
message-mode=legacy
message.no-permission=&cYou do not have permission.
message.players-only=&cOnly players can use this command.
message.disabled=&cNetwork teleports are not configured. Ask an administrator to set up the Paper bridge.
message.unavailable=&cThat player is unavailable for network teleportation.
message.self=&cYou are already here.
message.cooldown=&cPlease wait before sending another teleport request.
message.full=&cToo many teleport requests are pending. Try again shortly.
message.busy=&cYou already have a teleport request or transfer in progress. Use /{cancel} to cancel a request.
message.sent=&aTeleport request sent to {target}. It expires in {seconds} seconds.
message.received=&e{player} wants to teleport to you. Use /{accept} {player} or /{deny} {player}. Expires in {seconds} seconds.
message.none=&cNo matching teleport request is pending.
message.choose=&eSeveral requests are pending. Specify a player: /{command} <player>.
message.accepted=&aAccepted {player}'s request. Preparing the teleport.
message.denied=&eTeleport request denied.
message.declined=&e{target} declined your teleport request.
message.cancelled=&eTeleport request cancelled.
message.expired=&eThe teleport request involving {player} expired.
message.starting=&ePreparing to teleport to {target}.
message.success=&aTeleported to {target}.
message.failed=&cTeleport failed or was blocked. You may already be on the destination server; no location teleport was confirmed.
message.bridge-unavailable=&cThe destination teleport bridge did not respond. Your server was not changed.
message.timeout=&cTeleport timed out. You may already be on the destination server; no location teleport was confirmed.
message.usage-request=&e/{command} <player>
message.usage-accept=&e/{command} [player]
message.usage-deny=&e/{command} [player]
message.usage-cancel=&e/{command}
message.usage-staff=&e/{command} <player>
