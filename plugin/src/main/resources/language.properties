# Network Chat language — UTF-8 Java Properties.
# Chat formats/responses: /networkchat reload. Teleport responses: restart Velocity.
# Modes stay in config.properties (format.mode/message.mode) and teleport.properties (message-mode).
# Missing keys inherit bundled defaults. Language entries override legacy config entries.

# Chat, private messages and join/leave formats.
format.global=&8[&b{server}&8] {prefix}&f{player}&8: &7{message}
format.local=&8[Local] {prefix}&f{player}&8: &7{message}
format.staff=&8[&cStaff&8] [&7{server}&8] {prefix}&f{player}&8: &e{message}
format.private-sent=&8[&7You → {target}&8] &f{message}
format.private-received=&8[&7{player} → You&8] &f{message}
message.no-permission=&cYou do not have permission.
message.players-only=&cOnly players can use this command.
message.invalid-message=&cMessage must be 1–{limit} characters without control characters.
message.cooldown=&cPlease wait before sending another message.
message.unavailable=&cThat player is unavailable.
message.self=&cYou cannot message yourself.
message.private-disabled=&cPrivate messages are disabled.
message.no-reply=&cNobody has messaged you in this session.
message.ignored=&e{target}: ignore {state}.
message.toggle=&ePrivate message receiving: {state}.
message.channel=&eChat channel: {channel}.
message.invalid-channel=&cUse /chat global|local.
message.unsafe-channel=&cNormal chat cannot be captured safely here. Use /g or /sc instead.
message.excluded=&cNetwork chat is disabled on this server.
message.reload=&aConfiguration reloaded. Alias changes require a restart.
message.reload-failed=&cConfiguration invalid; previous configuration remains active. See proxy log.
message.usage-global=&e/g <message>
message.usage-staff=&e/sc [on|off|message]
message.usage-message=&e/msg <player> <message>
message.usage-reply=&e/reply <message>
message.usage-ignore=&e/ignore <player>
message.usage-admin=&e/networkchat reload|status
message.usage-whereami=&e/whereami
message.usage-find=&e/find <player>
message.whereami=&eYou are on {server}.
message.find=&e{target} is on {server}.
message.server-unavailable=&cYou are not connected to a server.
message.toggle-usage=&e/msgtoggle
message.ignore-limit=&cYou have reached the session ignore limit (1000).
message.reload-busy=&eA configuration reload is already running.
message.status=&ePlayers: {players}, sessions: {sessions}, capture: {capture}, SignedVelocity: {signed}. Announcements: join={join}, leave={leave}, scope={scope}, tracked={presence}, hidden={hidden}, debug={announcement-debug}.
message.staff-toggle=&eStaff chat: {state}.
message.staff-toggle-disabled=&cStaff chat toggling is disabled. Use /sc <message>.
message.staff-unsafe=&cStaff mode needs safe chat capture here. Use /sc <message>.
message.staff-switch-blocked=&cTurn staff mode off with /sc off before joining this server; safe chat capture is unavailable there.
message.staff-disconnected=&cStaff chat capture became unavailable. Your message was blocked to protect staff privacy. Reconnect and use /sc <message>.
message.queue-full=&cToo many messages are waiting for placeholders. Please try again shortly.
message.delivery-cancelled=&cMessage cancelled because your server or permissions changed before delivery.
format.join=&8[&a+&8] &f{player} &7joined the network.
format.leave=&8[&c-&8] &f{player} &7left the network.

# Teleport responses use a separate namespace to avoid chat-message collisions.
teleport.message.no-permission=&cYou do not have permission.
teleport.message.players-only=&cOnly players can use this command.
teleport.message.disabled=&cNetwork teleports are not configured. Ask an administrator to set up the Paper bridge.
teleport.message.unavailable=&cThat player is unavailable for network teleportation.
teleport.message.self=&cYou are already here.
teleport.message.cooldown=&cPlease wait before sending another teleport request.
teleport.message.full=&cToo many teleport requests are pending. Try again shortly.
teleport.message.busy=&cYou already have a teleport request or transfer in progress. Use /{cancel} to cancel a request.
teleport.message.sent=&aTeleport request sent to {target}. It expires in {seconds} seconds.
teleport.message.received=&e{player} wants to teleport to you. Use /{accept} {player} or /{deny} {player}. Expires in {seconds} seconds.
teleport.message.none=&cNo matching teleport request is pending.
teleport.message.choose=&eSeveral requests are pending. Specify a player: /{command} <player>.
teleport.message.accepted=&aAccepted {player}'s request. Preparing the teleport.
teleport.message.denied=&eTeleport request denied.
teleport.message.declined=&e{target} declined your teleport request.
teleport.message.cancelled=&eTeleport request cancelled.
teleport.message.expired=&eThe teleport request involving {player} expired.
teleport.message.starting=&ePreparing to teleport to {target}.
teleport.message.success=&aTeleported to {target}.
teleport.message.failed=&cTeleport failed or was blocked. You may already be on the destination server; no location teleport was confirmed.
teleport.message.bridge-unavailable=&cThe destination teleport bridge did not respond. Your server was not changed.
teleport.message.timeout=&cTeleport timed out. You may already be on the destination server; no location teleport was confirmed.
teleport.message.usage-request=&e/{command} <player>
teleport.message.usage-accept=&e/{command} [player]
teleport.message.usage-deny=&e/{command} [player]
teleport.message.usage-cancel=&e/{command}
teleport.message.usage-staff=&e/{command} <player>
